      - name: Audit imports (stdlib only)
        run: |
          python - <<'PY'
          import ast, sys, pathlib
          stdlib = set(sys.stdlib_module_names)
          offenders = []
          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module]
                  for name in names:
                      root = name.split('.')[0]
                      # 1. Allow standard library (json, re, urllib, etc.)
                      if root in stdlib:
                          continue
                      # 2. Allow local Python files (e.g., validator.py)
                      if (path.parent / f'{root}.py').exists():
                          continue
                      # 3. Allow local directories (e.g., the 'app' folder)
                      if (path.parent / root).is_dir():
                          continue
                      offenders.append(f'{path}: {name}')
          if offenders:
              print('::error::Third-party imports detected:')
              for o in offenders:
                  print(f'  {o}')
              sys.exit(1)
          print('OK: all imports resolve to the standard library')
          PY
