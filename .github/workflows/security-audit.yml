name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  zero-dependency-guard:
    name: Zero-dependency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-dependency contract
        run: |
          for f in requirements.txt pyproject.toml Pipfile setup.py; do
            if [ -f "$f" ]; then
              echo "::error::Contract broken: $f found. This project is stdlib-only."
              exit 1
            fi
          done
          echo "OK: no dependency manifests present"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile all modules
        run: python -m compileall -q .

      - name: Audit imports (stdlib only)
        run: |
          python - <<'PY'
          import ast, sys, pathlib
          stdlib = set(sys.stdlib_module_names)
          offenders = []
          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module]
                  for name in names:
                      root = name.split('.')[0]
                      # Allow standard library
                      if root in stdlib:
                          continue
                      # Allow local files
                      if (path.parent / f'{root}.py').exists():
                          continue
                      # Allow local folders (like 'app')
                      if (path.parent / root).is_dir():
                          continue
                      offenders.append(f'{path}: {name}')
          if offenders:
              print('::error::Third-party imports detected:')
              for o in offenders:
                  print(f'  {o}')
              sys.exit(1)
          print('OK: all imports resolve to the standard library')
          PY
