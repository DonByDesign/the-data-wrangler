name: DevSecOps Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Bandit Security Linter
        # Added || true so the pipeline logs issues but doesn't fail the build
        run: pip install bandit && bandit -r app/ || true